name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 自带 Android SDK，直接用它，不引第三方 setup action。
      - name: 装 SDK 组件
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "sdkmanager = $SM"
          test -x "$SM"

          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" 'platforms;android-34' 'build-tools;34.0.0'
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: 装 Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 单元测试
        run: gradle --no-daemon --console=plain testDebugUnitTest

      # 签名密钥来自 Secrets，仓库里没有（见 .gitignore）
      - name: 写入签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret KEYSTORE_BASE64，没法签名"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          ls -l keystore/release.keystore

      - name: 编译 release
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --console=plain assembleRelease

      - name: 校验签名
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: 整理产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/SideKeyPopup-${GITHUB_REF_NAME}.apk"
          ls -l out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SideKeyPopup-release
          path: out/*.apk

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 发布说明是仓库里手写的，不用 --generate-notes 那串链接
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::缺少发布说明 $NOTES"
            exit 1
          fi

          APK="$(ls out/*.apk)"
          {
            cat "$NOTES"
            echo
            echo "---"
            echo
            echo "**本次构建**　\`$(basename "$APK")\`　$(du -h "$APK" | cut -f1)"
            echo
            echo "SHA-256　\`$(sha256sum "$APK" | cut -d' ' -f1)\`"
          } > release-notes.md

          # --draft=false 不能省：gh 可能把 release 建/留在草稿状态，
          # 草稿匿名访问是看不到的，等于没发。
          publish() {
            gh release "$1" "$GITHUB_REF_NAME" --draft=false \
              --title "SideKeyPopup ${GITHUB_REF_NAME}" --notes-file release-notes.md
          }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            publish edit
          elif ! publish create; then
            # 已经存在一个草稿时 create 会失败，改用 edit 把它发出去
            publish edit
          fi
          gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
