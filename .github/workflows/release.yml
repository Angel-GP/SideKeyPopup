name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 自带 Android SDK，直接用它，不引第三方 setup action。
      - name: 装 SDK 组件
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "sdkmanager = $SM"
          test -x "$SM"

          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" 'platforms;android-34' 'build-tools;34.0.0'
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: 装 Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 单元测试
        run: gradle --no-daemon --console=plain testDebugUnitTest

      - name: 编译 release
        run: gradle --no-daemon --console=plain assembleRelease

      - name: 整理产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/SideKeyPopup-${GITHUB_REF_NAME}.apk"
          ls -l out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SideKeyPopup-release
          path: out/*.apk

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
