name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 装 SDK 组件
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: 装 Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 单元测试
        run: gradle --no-daemon --console=plain testDebugUnitTest

      - name: 编译 release
        run: gradle --no-daemon --console=plain assembleRelease

      - name: 整理产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/SideKeyPopup-${GITHUB_REF_NAME}.apk"
          ls -l out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SideKeyPopup-release
          path: out/*.apk

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
