plugins {
    id 'com.android.application'
}

android {
    namespace 'com.linxi.sidekeypopup'
    compileSdk 34

    defaultConfig {
        applicationId "com.linxi.sidekeypopup"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 签名密钥**不进仓库**（见 .gitignore）。两个来源，按顺序取：
    //   1. keystore/keystore.properties   —— 本地开发用，自己填
    //   2. SIGNING_* 环境变量             —— CI 里由 GitHub Secrets 注入
    // 都没有的话 release 就不签名（debug 仍可用 build.ps1 生成的调试密钥）。
    def signingProps = new Properties()
    def signingPropsFile = rootProject.file('keystore/keystore.properties')
    if (signingPropsFile.exists()) {
        signingPropsFile.withInputStream { signingProps.load(it) }
    }
    def signStoreFile = signingProps['storeFile'] ?: System.getenv('SIGNING_STORE_FILE')
    def signStorePassword = signingProps['storePassword'] ?: System.getenv('SIGNING_STORE_PASSWORD')
    def signKeyAlias = signingProps['keyAlias'] ?: System.getenv('SIGNING_KEY_ALIAS')
    def signKeyPassword = signingProps['keyPassword'] ?: System.getenv('SIGNING_KEY_PASSWORD')
    def hasReleaseSigning = signStoreFile && signStorePassword && signKeyAlias && signKeyPassword

    signingConfigs {
        // 调试密钥由 tools/build.ps1 在本机生成，不进仓库。
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(signStoreFile)
                storePassword signStorePassword
                keyAlias signKeyAlias
                keyPassword signKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // Shizuku 的用户服务靠 AIDL 跨进程通信，必须显式打开。
    buildFeatures {
        aidl true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

// Robolectric 运行时会去 Maven 下载 android-all jar，国内走阿里云镜像；
// 同时把 user.home 指到构建目录里，否则下载锁文件会写到 C:\Users\<name> 下。
tasks.withType(Test).configureEach {
    def roboHome = layout.buildDirectory.dir('robolectric-home').get().asFile
    doFirst { roboHome.mkdirs() }
    systemProperty 'robolectric.dependency.repo.url', 'https://maven.aliyun.com/repository/public'
    systemProperty 'robolectric.dependency.repo.id', 'aliyun'
    systemProperty 'user.home', roboHome.absolutePath
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Shizuku / Sui：以 shell 身份读 /dev/input，作为无障碍之外的另一条路。
    // 两个 AAR 的 aar-metadata 里 minCompileSdk=1，不会像 libxposed 那样被 AGP 拒掉。
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // 在 JVM 上真跑一遍界面和配置读写，不需要真机 / 模拟器。
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
}
